name: Retroflight 3D verification
on:
  push:
    paths:
      - 'public/imagine/SpaceShooters2/**'
      - 'tests/retroflight*'
      - '.github/workflows/retroflight-3d-checks.yml'
  pull_request:
    paths:
      - 'public/imagine/SpaceShooters2/**'
      - 'tests/retroflight*'
  workflow_dispatch:
jobs:
  physics-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 3D game physics
        run: node --test tests/retroflight.physics.test.cjs
      - name: Verify local files and supported layouts
        run: python -m unittest discover -s tests -p retroflight_static.py -v
      - name: Set up browser test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify desktop, Chromebook, phone, tablet, weapons, and upgrade persistence
        run: python tests/retroflight_browser_smoke.py
