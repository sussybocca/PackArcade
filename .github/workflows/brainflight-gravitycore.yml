name: Brainflight GravityCore TargetLock verification
on:
  push:
    paths:
      - 'public/imagine/SpaceShooters2/**'
      - 'tests/retroflight*'
      - '.github/workflows/brainflight-gravitycore.yml'
  pull_request:
    paths:
      - 'public/imagine/SpaceShooters2/**'
      - 'tests/retroflight*'
  workflow_dispatch:
jobs:
  physics-ai-gravity-aim-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original physics and new AI, gravity, targeting, mobile input
        run: node --test tests/retroflight.physics.test.cjs tests/retroflight.systems.test.cjs
      - name: Validate source and device layouts
        run: python -m unittest discover -s tests -p retroflight_static.py -v
      - name: Install browser engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real WebGL browser smoke test across device layouts
        run: python tests/retroflight_browser_smoke.py
