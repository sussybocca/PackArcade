# PackArcade NEXT — one anonymous arcade, no user-site publishing or subdomain routing.
[build]
  publish = "."
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Retire old creator, account, and site-administration frontends.
[[redirects]]
  from = "/dashboard.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/game-builder.html"
  to = "/"
  status = 301
  force = true
