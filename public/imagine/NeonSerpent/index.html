<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Serpent — PackArcade</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#243452,#0a1020 70%);color:#e7faff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}h1{font-size:clamp(24px,5vw,46px);margin:0 0 3px;letter-spacing:-1px;color:#a8ffc8;text-shadow:0 0 26px #48e0a777}.desc{color:#92b1c1;font-size:13px;text-align:center;margin:2px 0 13px}.stats{display:flex;justify-content:space-between;width:min(90vw,450px);font-size:14px;margin-bottom:9px}.stats strong{color:#bcffce}.board{position:relative;width:min(90vw,450px,55dvh);aspect-ratio:1;min-width:220px;border:2px solid #3fe8ae;border-radius:13px;box-shadow:0 0 35px #1fd9ac44;overflow:hidden;background:#0c1521}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#08101cde;text-align:center;padding:20px}.overlay[hidden]{display:none}.overlay h2{font-size:25px;margin:0}.overlay p{font-size:13px;line-height:1.5;color:#afccd1;margin:0}.primary{background:#58e3ad;border:0;color:#081b1e;font-weight:800;border-radius:12px;padding:12px 28px;font-size:14px}.controls{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,47px);gap:6px;justify-content:center;margin-top:14px;touch-action:none}.controls button{border:1px solid #67ffd95a;color:#b0ffdd;background:#1b3543;border-radius:10px;font-size:25px;touch-action:none}.controls button:active{background:#3e9b87}.controls .up{grid-column:2;grid-row:1}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.row-actions{display:flex;gap:10px;margin-top:13px}.row-actions button{border:1px solid #4d9e91;border-radius:9px;background:#192c3b;color:#bbffe0;padding:9px 15px}.note{font-size:11px;color:#779aa1;margin:9px 0 0;text-align:center}@media(max-height:650px) and (orientation:landscape){body{padding:8px}.board{width:min(45vw,70vh)}.controls{position:fixed;right:4vw;bottom:12%;margin:0}.row-actions{position:fixed;left:4vw;bottom:15%}.stats{width:min(50vw,450px)}h1{font-size:21px}.desc{font-size:11px;margin-bottom:5px}}@media(pointer:fine) and (min-height:650px){.controls{opacity:.75}}
</style></head><body><h1>NEON SERPENT</h1><p class="desc">Collect the glowing orbs. Don't run into the walls or yourself.</p><div class="stats"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><div class="board" id="board"><canvas id="field" width="480" height="480" aria-label="Snake game board"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">Neon Serpent</h2><p id="overlayText">Swipe, use the arrow keys or WASD, or tap the direction buttons.</p><button id="start" class="primary">Start game ▶</button></div></div><div class="controls" aria-label="Touch direction controls"><button class="up" data-dir="up" aria-label="Up">↑</button><button class="left" data-dir="left" aria-label="Left">←</button><button class="down" data-dir="down" aria-label="Down">↓</button><button class="right" data-dir="right" aria-label="Right">→</button></div><div class="row-actions"><button id="pause">Pause</button><button id="restart">Restart</button></div><p class="note">Original PackArcade game · Keyboard and touch controls</p><script>
(()=>{'use strict';const grid=24,size=480,cell=size/grid,canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');const $=id=>document.getElementById(id);let snake,food,direction,nextDirection,score,best=0,state='idle',timer=null;try{best=Math.max(0,Number(localStorage.getItem('pa-neonserpent-best'))||0)}catch{}$('best').textContent=best;
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function reset(){snake=[[11,12],[10,12],[9,12]];direction='right';nextDirection='right';score=0;$('score').textContent=0;food=placeFood();draw()}
function placeFood(){const free=[];for(let y=0;y<grid;y++)for(let x=0;x<grid;x++)if(!snake.some(s=>s[0]===x&&s[1]===y))free.push([x,y]);return free.length?free[Math.floor(Math.random()*free.length)]:null}
function show(title,text,button){$('overlayTitle').textContent=title;$('overlayText').textContent=text;$('start').textContent=button;overlay.hidden=false}function hide(){overlay.hidden=true}
function draw(){ctx.clearRect(0,0,size,size);ctx.fillStyle='#07131d';ctx.fillRect(0,0,size,size);ctx.strokeStyle='#193245';ctx.lineWidth=.55;for(let x=0;x<=grid;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,x*cell);ctx.lineTo(size,x*cell);ctx.stroke()}if(food){const fx=(food[0]+.5)*cell,fy=(food[1]+.5)*cell;ctx.shadowColor='#ff78b9';ctx.shadowBlur=19;ctx.fillStyle='#ff6dae';ctx.beginPath();ctx.arc(fx,fy,7.6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
snake.forEach(([x,y],i)=>{ctx.shadowColor=i===0?'#a4ffc4':'#21d89c';ctx.shadowBlur=i===0?16:8;ctx.fillStyle=i===0?'#a5ffca':'#48e5b1';ctx.beginPath();ctx.roundRect(x*cell+2,y*cell+2,cell-4,cell-4,5);ctx.fill();ctx.shadowBlur=0});}
function setDirection(dir){if(!dirs[dir])return;const a=dirs[direction],b=dirs[dir];if(a[0]+b[0]===0&&a[1]+b[1]===0)return;nextDirection=dir}
function step(){if(state!=='running')return;direction=nextDirection;const v=dirs[direction],head=snake[0],newHead=[head[0]+v[0],head[1]+v[1]],eats=food&&newHead[0]===food[0]&&newHead[1]===food[1];const collisionSnake=eats?snake:snake.slice(0,-1);if(newHead[0]<0||newHead[1]<0||newHead[0]>=grid||newHead[1]>=grid||collisionSnake.some(s=>s[0]===newHead[0]&&s[1]===newHead[1])){finish(false);return}snake.unshift(newHead);if(eats){score+=10;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('pa-neonserpent-best',String(best))}catch{}}food=placeFood();if(!food){finish(true);return}clearInterval(timer);timer=setInterval(step,Math.max(64,130-score/8))}else snake.pop();draw()}
function finish(won){clearInterval(timer);timer=null;state='over';show(won?'You filled the board!':'Game over','You scored '+score+' points. Best: '+best+'.','Play again ▶')}
function start(){clearInterval(timer);reset();state='running';hide();timer=setInterval(step,130)}function pause(){if(state==='running'){clearInterval(timer);timer=null;state='paused';$('pause').textContent='Resume';show('Paused','Ready when you are.','Resume ▶')}else if(state==='paused'){state='running';hide();timer=setInterval(step,Math.max(64,130-score/8));$('pause').textContent='Pause'}}
$('start').addEventListener('click',()=>state==='paused'?pause():start());$('pause').addEventListener('click',pause);$('restart').addEventListener('click',start);document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(button.dataset.dir)}));document.addEventListener('keydown',e=>{const key=e.key.toLowerCase(),name=({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'})[key];if(name){e.preventDefault();setDirection(name)}else if(key===' '){e.preventDefault();if(state==='idle'||state==='over')start();else pause()}});
let startTouch=null;canvas.addEventListener('touchstart',e=>{startTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!startTouch)return;const dx=e.changedTouches[0].clientX-startTouch.x,dy=e.changedTouches[0].clientY-startTouch.y;if(Math.hypot(dx,dy)>20)setDirection(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');startTouch=null},{passive:true});reset();})();
</script></body></html>
