<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orbit Rally — PackArcade</title><style>*{box-sizing:border-box}html{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 40% -10%,#452567,#070818 75%);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px}h1{font-size:clamp(24px,6vw,48px);letter-spacing:-.04em;margin:0;background:linear-gradient(90deg,#fd88db,#9bd5ff);background-clip:text;color:transparent}.hint{color:#a9a9c8;text-align:center;font-size:12px;margin:6px 0 16px}.score{font-size:28px;display:flex;gap:50px;margin-bottom:12px}.score strong{color:#ff88d1}.score span+span strong{color:#9bd8ff}.arena{position:relative;max-width:960px;width:100%;aspect-ratio:16/10;border:2px solid #6d578c;border-radius:16px;box-shadow:0 12px 60px #e481de2a;background:#0b0d27;overflow:hidden;touch-action:none}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.mask{position:absolute;inset:0;background:#0b0c24ec;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;gap:15px;text-align:center}.mask[hidden]{display:none}.mask h2{font-size:clamp(24px,4vw,36px);margin:0}.mask p{color:#b7add4;font-size:13px;max-width:360px;line-height:1.5;margin:0}.start{border:0;border-radius:50px;background:#d9a3ff;color:#1c1031;font-weight:800;padding:12px 32px}.actions{display:flex;gap:10px;margin-top:15px}.actions button{background:#34224c;color:#eee;border:1px solid #74568e;border-radius:11px;padding:10px 16px;min-width:90px}.touch{display:none;gap:13px;margin-top:12px}.touch button{border:1px solid #9c7fe2;border-radius:15px;background:#3c2d62;color:white;width:90px;height:54px;font-size:22px;touch-action:none}@media(pointer:coarse){.touch{display:flex}}@media(max-height:650px) and (orientation:landscape){body{padding:6px}h1{font-size:20px}.hint{margin:3px}.score{font-size:16px;margin-bottom:3px}.arena{height:66vh;width:auto}.actions{position:absolute;right:1%;bottom:3%}.touch{position:absolute;left:1%;bottom:3%}.touch button{width:45px;height:40px}}</style></head><body><h1>ORBIT RALLY</h1><p class="hint">Move your paddle with the mouse, touch, or W/S/arrow keys. First to 7 wins.</p><div class="score"><span>YOU <strong id="you">0</strong></span><span>CPU <strong id="cpu">0</strong></span></div><div class="arena" id="arena"><canvas id="canvas" width="960" height="600" aria-label="Neon pong arena"></canvas><div class="mask" id="mask"><h2 id="headline">Orbit Rally</h2><p id="message">Play responsive Pong against a computer opponent.</p><button class="start" id="start">Play now ▶</button></div></div><div class="touch"><button data-move="up" aria-label="Paddle up">↑</button><button data-move="down" aria-label="Paddle down">↓</button></div><div class="actions"><button id="pause">Pause</button><button id="restart">Restart</button></div><script>(()=>{'use strict';const c=document.getElementById('canvas'),ctx=c.getContext('2d'),a=document.getElementById('arena');const $=id=>document.getElementById(id);let playerY=247,cpuY=247,ball={x:480,y:300,vx:6,vy:2.1},player=0,cpu=0,state='idle',last=0,raf=0,keys={up:false,down:false},pointerAt=null;const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));function show(head,msg,button){$('headline').textContent=head;$('message').textContent=msg;$('start').textContent=button;$('mask').hidden=false}function resetBall(toward){ball={x:480,y:300,vx:(toward||1)*5.4,vy:(Math.random()*.8-.4)*5+1};playerY=247;cpuY=247}
function reset(){cancelAnimationFrame(raf);player=0;cpu=0;$('you').textContent=0;$('cpu').textContent=0;resetBall(Math.random()<.5?1:-1);state='playing';$('mask').hidden=true;last=performance.now();raf=requestAnimationFrame(loop)}
function scorePoint(winner){if(winner==='you'){$('you').textContent=++player}else $('cpu').textContent=++cpu;if(player===7||cpu===7){state='finished';show(player===7?'You win!':'CPU wins',`Final score ${player}–${cpu}. Ready for another round?`,'Play again ▶');return}resetBall(winner==='you'?-1:1)}
function draw(){ctx.fillStyle='#0b0c27';ctx.fillRect(0,0,960,600);ctx.save();ctx.strokeStyle='#423c69';ctx.setLineDash([15,21]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(480,0);ctx.lineTo(480,600);ctx.stroke();ctx.restore();ctx.strokeStyle='#533d6d';ctx.strokeRect(10,10,940,580);ctx.shadowBlur=25;ctx.shadowColor='#fa86d6';ctx.fillStyle='#fa86d6';ctx.fillRect(29,playerY,16,106);ctx.shadowColor='#87dfff';ctx.fillStyle='#87dfff';ctx.fillRect(915,cpuY,16,106);ctx.shadowColor='#fff';ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function loop(t){const dt=Math.min((t-last)/16.66,2);last=t;if(state!=='playing')return;if(pointerAt!==null)playerY=clamp(pointerAt-53,17,477);if(keys.up)playerY-=8*dt;if(keys.down)playerY+=8*dt;playerY=clamp(playerY,17,477);const target=ball.y-53+(ball.vx<0?0:Math.sin(t/240)*14);cpuY+=clamp(target-cpuY,-4.4*dt,4.4*dt);cpuY=clamp(cpuY,17,477);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y<23||ball.y>577){ball.vy*=-1;ball.y=clamp(ball.y,23,577)}if(ball.x<56&&ball.vx<0&&ball.y>=playerY-8&&ball.y<=playerY+114){ball.vx=Math.min(12,Math.abs(ball.vx)*1.075);ball.vy+=((ball.y-(playerY+53))/54)*2.1;ball.x=56}if(ball.x>904&&ball.vx>0&&ball.y>=cpuY-8&&ball.y<=cpuY+114){ball.vx=-Math.min(12,Math.abs(ball.vx)*1.075);ball.vy+=((ball.y-(cpuY+53))/54)*1.8;ball.x=904}if(ball.x<0)scorePoint('cpu');if(ball.x>960)scorePoint('you');draw();if(state==='playing')raf=requestAnimationFrame(loop)}
function pause(){if(state==='playing'){state='paused';cancelAnimationFrame(raf);$('pause').textContent='Resume';show('Paused','Your rally is on hold.','Resume ▶')}else if(state==='paused'){state='playing';$('mask').hidden=true;$('pause').textContent='Pause';last=performance.now();raf=requestAnimationFrame(loop)}}
$('start').onclick=()=>state==='paused'?pause():reset();$('pause').onclick=pause;$('restart').onclick=reset;function point(e){const r=c.getBoundingClientRect();pointerAt=(e.clientY-r.top)*600/r.height}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)point(e)});document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','w','s','W','S',' '].includes(e.key))e.preventDefault();if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(e.key===' ')state==='idle'||state==='finished'?reset():pause()});document.addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false});document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pointerAt=null;keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});draw()})();</script></body></html>
