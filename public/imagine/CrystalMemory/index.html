<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crystal Memory — PackArcade</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 10%,#47316a,#110e24 75%);color:#fff;padding:17px}h1{font-size:clamp(26px,6vw,44px);margin:0;color:#e4bdff;letter-spacing:-1px}.desc{font-size:13px;color:#b6a6c9;margin:7px 0 20px;text-align:center}.stats{display:flex;justify-content:space-between;width:min(100%,520px);margin-bottom:14px;font-size:13px;color:#b5a3cc}.stats strong{font-size:18px;color:#f3daff}.board{width:min(100%,520px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.tile{aspect-ratio:1;background:linear-gradient(135deg,#4a296f,#2c1b53);border:2px solid #7355a5;border-radius:16px;color:#e2c8ff;font-size:clamp(28px,8vw,57px);display:grid;place-items:center;box-shadow:0 6px 18px #0005;transition:transform .2s,background .2s;user-select:none;touch-action:manipulation}.tile:hover{border-color:#cca1ff}.tile:active{transform:scale(.97)}.tile.open{background:linear-gradient(135deg,#7651a8,#3f2a73);border-color:#c198ed}.tile.matched{background:#204850;color:#a9ffff;border-color:#50b9c5;opacity:.82;cursor:default}.tile:not(.open):not(.matched){font-size:clamp(28px,6vw,44px)}.footer{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:20px}.footer button{background:#a77acc;color:#201233;border:0;border-radius:24px;padding:12px 27px;font-weight:800}.win{color:#acefdd;font-size:14px;text-align:center;min-height:18px}.note{font-size:11px;color:#9280ac}@media(max-width:450px){.board{gap:8px}.tile{border-radius:11px}.desc{margin-bottom:14px}.footer{margin-top:15px}}@media(max-height:650px) and (orientation:landscape){body{padding:8px}.board{width:min(65vh,420px)}.tile{border-radius:8px}.desc{margin:1px 0 6px}.stats{margin-bottom:6px;width:min(65vh,420px)}h1{font-size:22px}.footer{margin-top:5px}}</style></head><body><h1>CRYSTAL MEMORY</h1><p class="desc">Find all eight crystal pairs in as few moves as possible.</p><div class="stats"><span>Moves <strong id="moves">0</strong></span><span>Time <strong id="time">0:00</strong></span><span>Best <strong id="best">—</strong></span></div><div class="board" id="board" aria-label="Memory game cards"></div><div class="footer"><button id="restart">New game ↻</button><span class="win" id="win" role="status"></span></div><p class="note">Original PackArcade game · Mouse, keyboard and touch</p><script>(()=>{'use strict';const $=id=>document.getElementById(id),symbols=['☀','☄','✦','✧','♢','✺','♜','❀'];let cards=[],opened=[],matched=0,moves=0,sec=0,interval=null,locked=false,pending=null,best=null;try{const b=Number(localStorage.getItem('pa-crystal-best'));if(b>0)best=b}catch{}function display(){ $('moves').textContent=moves;$('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('best').textContent=best||'—'}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startTimer(){if(interval)return;interval=setInterval(()=>{sec++;display()},1000)}function clear(){clearInterval(interval);interval=null;clearTimeout(pending);pending=null}
function newGame(){clear();cards=shuffle([...symbols,...symbols]).map((sym,id)=>({sym,id,matched:false}));opened=[];matched=0;moves=0;sec=0;locked=false;$('win').textContent='';const board=$('board');board.replaceChildren();cards.forEach((card,i)=>{const button=document.createElement('button');button.className='tile';button.type='button';button.setAttribute('aria-label','Hidden card '+(i+1));button.textContent='◆';button.addEventListener('click',()=>flip(i));board.append(button)});display()}
function flip(i){const card=cards[i];if(locked||card.matched||opened.includes(i)||matched===8)return;startTimer();opened.push(i);const el=$('board').children[i];el.classList.add('open');el.textContent=card.sym;el.setAttribute('aria-label','Revealed '+card.sym);if(opened.length===2){moves++;display();const [a,b]=opened;if(cards[a].sym===cards[b].sym){cards[a].matched=cards[b].matched=true;opened=[];matched++;[a,b].forEach(j=>{$('board').children[j].classList.add('matched');$('board').children[j].disabled=true});if(matched===8){clear();if(best===null||moves<best){best=moves;try{localStorage.setItem('pa-crystal-best',String(best))}catch{}}$('win').textContent='Perfect match! All crystals found in '+moves+' moves.';display()}}else{locked=true;pending=setTimeout(()=>{[a,b].forEach(j=>{const e=$('board').children[j];e.classList.remove('open');e.textContent='◆';e.setAttribute('aria-label','Hidden card '+(j+1))});opened=[];locked=false;pending=null},700)}}}
$('restart').addEventListener('click',newGame);newGame()})();</script></body></html>
